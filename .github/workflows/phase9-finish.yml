name: Phase 9 finish and verification

on:
  push:
    branches:
      - hardening/admin-production-readiness

permissions:
  contents: write

jobs:
  verify-and-finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/admin-production-readiness
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wire server pricing quote into customer pay flow
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/app/pay-flow.tsx")
          text = path.read_text()

          if 'from "@/lib/pricing.functions"' not in text:
              text = text.replace(
                  'import { initializeDirectBillPay } from "@/lib/direct-bill.functions";\n',
                  'import { initializeDirectBillPay } from "@/lib/direct-bill.functions";\nimport { quotePricing } from "@/lib/pricing.functions";\n',
              )

          if 'const getPricingQuote = useServerFn(quotePricing);' not in text:
              text = text.replace(
                  '  const initDirectPay = useServerFn(initializeDirectBillPay);\n',
                  '  const initDirectPay = useServerFn(initializeDirectBillPay);\n  const getPricingQuote = useServerFn(quotePricing);\n',
              )

          if 'const [quotedAmount, setQuotedAmount]' not in text:
              text = text.replace(
                  '  const [token, setToken] = useState("");\n\n  const total = isPackageLive && variation ? variation.amount : Number(amount || 0);\n',
                  '  const [token, setToken] = useState("");\n  const [quotedAmount, setQuotedAmount] = useState<number | null>(null);\n\n  const baseTotal = isPackageLive && variation ? variation.amount : Number(amount || 0);\n  const total = quotedAmount ?? baseTotal;\n',
              )

          if 'const continueToConfirm = async () =>' not in text:
              marker = '  const runDirectPay = async () => {\n'
              helper = '''  const continueToConfirm = async () => {\n    if (baseTotal < 50 || (isPackageLive && !variation)) return;\n    setError("");\n    try {\n      const pricingService = isAirtime\n        ? "airtime"\n        : isData\n          ? "data"\n          : isCable\n            ? "cable"\n            : "electricity";\n      const quote = await getPricingQuote({\n        data: {\n          service: pricingService,\n          provider: serviceID || provider || null,\n          productCode: variation?.variationCode ?? null,\n          baseAmount: baseTotal,\n        },\n      });\n      setQuotedAmount(quote.customerAmount);\n      setStep("confirm");\n    } catch (err) {\n      toast.error(friendlyError(err, "Could not calculate the payment amount."));\n    }\n  };\n\n'''
              if marker not in text:
                  raise SystemExit("runDirectPay marker not found")
              text = text.replace(marker, helper + marker, 1)

          old = '''              onChange={(e) => setAmount(e.target.value.replace(/\\D/g, ""))}\n'''
          new = '''              onChange={(e) => {\n                setAmount(e.target.value.replace(/\\D/g, ""));\n                setQuotedAmount(null);\n              }}\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''                  setVariation(v);\n                  scrollIntoAction("pay-action");\n'''
          new = '''                  setVariation(v);\n                  setQuotedAmount(null);\n                  scrollIntoAction("pay-action");\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''                  <Button\n              className="h-12 w-full rounded-xl font-bold"\n              disabled={total < 50 || (isPackageLive && !variation)}\n              onClick={() => setStep("confirm")}\n            >\n'''
          new = '''                  <Button\n              className="h-12 w-full rounded-xl font-bold"\n              disabled={baseTotal < 50 || (isPackageLive && !variation)}\n              onClick={() => void continueToConfirm()}\n            >\n'''
          if old not in text:
              old = '''            <Button\n              className="h-12 w-full rounded-xl font-bold"\n              disabled={total < 50 || (isPackageLive && !variation)}\n              onClick={() => setStep("confirm")}\n            >\n'''
              new = '''            <Button\n              className="h-12 w-full rounded-xl font-bold"\n              disabled={baseTotal < 50 || (isPackageLive && !variation)}\n              onClick={() => void continueToConfirm()}\n            >\n'''
          if old in text:
              text = text.replace(old, new, 1)
          else:
              raise SystemExit("amount Continue button not found")

          path.write_text(text)

      - name: Run automated contracts
        run: bun test

      - name: Build production bundle
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Commit Phase 9 implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Phase 9 implementation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/pay-flow.tsx
          git commit -m "fix: wire customer pricing quote into pay flow"
          git push origin hardening/admin-production-readiness
