name: Phase 9 verification

# Production verification for deployable branches.
#
# Normalize files before validation. Only push-triggered runs may commit
# mechanical formatting changes; pull-request runs must never try to push from
# GitHub's detached checkout, so tests/build/lint can always run on the PR.
on:
  push:
    branches:
      - feature/rockpay-pricing
      - main
      - hardening/admin-production-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize deterministic source formatting
        run: |
          node scripts/normalize-bill-flow-hooks.mjs
          bun run format

      - name: Commit mechanical normalization
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize source formatting"
          git push

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint
