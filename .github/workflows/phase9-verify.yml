name: Phase 9 verification

# Keep the production verification workflow attached to the branches that can
# contain deployable application code. This prevents a green CI result on an
# unrelated hardening branch from being mistaken for feature-branch health.
on:
  push:
    branches:
      - feature/rockpay-pricing
      - main
      - hardening/admin-production-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint
