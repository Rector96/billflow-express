name: Phase 9 verification

# Production verification for deployable branches.
#
# The workflow also performs the repository's existing Prettier normalization
# and the small React-hook ordering maintenance check before linting. This is
# deliberately limited to deterministic formatting/maintenance changes; it
# does not change business logic, pricing, providers, payment amounts, or DB
# data. If normalization changes files, CI commits only those mechanical
# changes back to the same feature branch so the repository stays clean for
# the next developer/audit. Main is never modified by this job directly.
on:
  push:
    branches:
      - feature/rockpay-pricing
      - main
      - hardening/admin-production-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize deterministic source formatting
        run: |
          node scripts/normalize-bill-flow-hooks.mjs
          bun run format

      - name: Commit mechanical normalization
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: normalize source formatting"
          git push

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint
