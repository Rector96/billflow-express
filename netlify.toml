# Netlify deployment config — BillPay demo (TanStack Start + Nitro SSR)
# Nitro's "netlify" preset emits the static assets to dist/ and the SSR
# handler to .netlify/functions-internal, so no manual redirects are needed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
