# Netlify — BillFlow Express (TanStack Start + Nitro SSR)
# IMPORTANT: Site production branch should be `feature/rockpay-pricing`
# until hub work is merged to main. main does not include /cac, /nin, etc.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  # Bake hub preview into every build (VITE_ vars must exist at build time)
  VITE_HUB_PREVIEW_FLOWS = "true"
  HUB_PREVIEW_FLOWS = "true"

# Required environment variables (Site settings → Environment):
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_URL
#   SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   PAYSTACK_SECRET_KEY

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
