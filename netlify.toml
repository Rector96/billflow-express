# Netlify deployment — BillFlow Express (TanStack Start + Nitro SSR)
# vite.config.ts switches Nitro to the "netlify" preset when NETLIFY=true,
# which emits static assets to dist/ and the SSR handler to
# .netlify/functions-internal, with the SSR fallback redirect declared below.
#
# Full backend setup: EXTERNAL_SUPABASE_SETUP.md

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Required environment variables (Site settings → Environment):
#   VITE_SUPABASE_URL              — your project URL (build-time)
#   VITE_SUPABASE_PUBLISHABLE_KEY  — anon / sb_publishable_ (build-time)
#   VITE_SUPABASE_PROJECT_ID       — optional project ref
#   SUPABASE_URL                   — same URL (runtime SSR)
#   SUPABASE_PUBLISHABLE_KEY       — same publishable key (runtime)
#   SUPABASE_SERVICE_ROLE_KEY      — service_role / sb_secret_ (server only)
#   PAYSTACK_SECRET_KEY            — sk_test_... (server only)

# Nitro's netlify preset emits the SSR handler as the internal function "server".
# Static files in dist/ win first; everything else (deep links, refreshes, /api/*)
# is rewritten to the SSR function instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
